name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (Testcontainers uses the runner's Docker)
        working-directory: tradingco-backend
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: tradingco-backend/target/surefire-reports/

  frontend:
    name: Frontend — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tradingco-frontend/package-lock.json

      - name: Install
        working-directory: tradingco-frontend
        run: npm ci

      - name: Lint
        working-directory: tradingco-frontend
        run: npm run lint

      - name: Build
        working-directory: tradingco-frontend
        run: npm run build
