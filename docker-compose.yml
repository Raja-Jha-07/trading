services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradingco
      POSTGRES_USER: tradingco
      POSTGRES_PASSWORD: tradingco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingco"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./tradingco-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  frontend:
    build: ./tradingco-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
